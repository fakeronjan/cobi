name: Update COBI Ratings

on:
  schedule:
    - cron: '33 19 * * *'  # backstop, 19:33 UTC. The droplet (157.245.209.249) dispatches this at 16:33 UTC; GitHub's own cron starts hours late, see /opt/fleet-dispatch there
  workflow_dispatch:        # manual trigger from GitHub UI

permissions:
  contents: write           # needed for git push

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install cython numpy
          pip install --no-build-isolation -r requirements.txt

      # Ratings cache lives in the Actions cache, not git (a regenerable
      # incremental scratchpad that was re-committed every run, ~11MB/month).
      # Rolling key + prefix restore-keys: every run writes a fresh entry and
      # restores the most recent prior one. A miss is safe: cobi.py rebuilds
      # from scratch.
      - name: Restore ratings cache
        uses: actions/cache/restore@v4
        with:
          path: cobi_ratings.csv.gz
          key: cobi-ratings-${{ github.run_id }}
          restore-keys: cobi-ratings-

      - name: Run ratings engine
        run: python cobi.py

      # Only reached if cobi.py succeeded, so a failed run never saves a
      # partial cache.
      - name: Save ratings cache
        uses: actions/cache/save@v4
        with:
          path: cobi_ratings.csv.gz
          key: cobi-ratings-${{ github.run_id }}

      # Once the regular season ends: the real playoff seeds (warns, then
      # fails the run if they can't be fetched and checked)
      - name: Real playoff seeds
        run: python playoff_seeds.py

      # title_odds_cache/ holds per-season Monte Carlo results (title_odds.py),
      # fingerprinted by engine code + each season's games and ratings, so a
      # stale entry recomputes itself. A miss rebuilds everything.
      - name: Restore title-odds cache
        uses: actions/cache/restore@v4
        with:
          path: title_odds_cache
          key: cobi-odds-${{ github.run_id }}
          restore-keys: cobi-odds-

      # matchups_cache/ holds per-season Daily Matchups (daily_matchups.py),
      # fingerprinted the same way: a stale or missing season recomputes.
      - name: Restore matchups cache
        uses: actions/cache/restore@v4
        with:
          path: matchups_cache
          key: cobi-matchups-${{ github.run_id }}
          restore-keys: cobi-matchups-

      - name: Generate web data
        run: python generate_data.py

      - name: Save matchups cache
        uses: actions/cache/save@v4
        with:
          path: matchups_cache
          key: cobi-matchups-${{ github.run_id }}

      - name: Save title-odds cache
        uses: actions/cache/save@v4
        with:
          path: title_odds_cache
          key: cobi-odds-${{ github.run_id }}

      - name: Commit and push updated data
        run: |
          git config user.name  "COBI Bot"
          git config user.email "cobi-bot@users.noreply.github.com"
          git add all_club_games.csv cobi_standings.csv cobi_trophies.csv mls_schedule.csv mls_playoff_seeds.json mls_kickoffs.csv docs/data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update ratings $(date -u '+%Y-%m-%d')"
            # Race-safe push: if another commit landed during this run, rebase
            # the data update on top and retry. Avoids losing a day's data
            # update when a code push lands mid-cron-run.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed; retrying in 5s..."
              sleep 5
            done
          fi
